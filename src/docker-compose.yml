services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop
      POSTGRES_DB: shop

    ports:
      - "5432:5432"
    volumes:
      - shop_postgres_data:/var/lib/postgresql/data
      - ./db/address.sql:/docker-entrypoint-initdb.d/01-address.sql
      - ./db/image.sql:/docker-entrypoint-initdb.d/02-image.sql
      - ./db/supplier.sql:/docker-entrypoint-initdb.d/03-supplier.sql
      - ./db/client.sql:/docker-entrypoint-initdb.d/04-client.sql
      - ./db/product.sql:/docker-entrypoint-initdb.d/05-product.sql
  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin

    ports:
      - "5050:80"
  auth_database:
    image: postgres:17
    environment:
      POSTGRES_USER: users
      POSTGRES_PASSWORD: users
      POSTGRES_DB: users
    ports:
      - "5431:5432"
    volumes: 
      - users_postgres_data:/var/lib/postgresql/data
      - ./db/users.sql:/docker-entrypoint-initdb.d/01-users.sql

  rebbitmq:
    image: rabbitmq:latest   
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
  redis:
    image: redis:latest
    ports:
      - "6379:6379"
    volumes:
      - redis_storage:/data
volumes:
  shop_postgres_data:
  users_postgres_data:
  redis_storage:































